<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Sudoku Fighting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Barlow+Condensed:wght@900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicons/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/assets/favicons/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicons/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/favicons/site.webmanifest" />
  <meta name="theme-color" content="#FF8B16" />
  <meta property="og:title" content="Sudoku Fighting" />
  <meta property="og:description" content="Multiplayer sudoku with fighting game combat" />
  <meta property="og:image" content="https://sudokufighting.com/assets/shared/share_image.png" />
  <meta property="og:url" content="https://sudokufighting.com/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sudoku Fighting" />
  <meta name="twitter:description" content="Multiplayer sudoku with fighting game combat" />
  <meta name="twitter:image" content="https://sudokufighting.com/assets/shared/share_image.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ===== PERSISTENT HEADER ===== -->
  <header class="app-header">
    <div class="header-left">
      <button class="btn btn-sm hidden" id="btn-back" aria-label="Back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:2px"><polyline points="15 5 9 12 15 19"/></svg> BACK</button>
    </div>
    <div class="header-right">
      <!-- Settings icon — swap the <svg> contents for a custom icon later -->
      <button class="header-icon-btn btn-utility" id="btn-settings" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
          <path d="M12 15.5a3.5 3.5 0 0 1-3.5-3.5A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.33.07-.64.07-.97s-.03-.66-.07-1l2.16-1.63c.19-.15.24-.42.12-.64l-2.04-3.53c-.12-.22-.37-.3-.59-.22l-2.55 1.01c-.53-.4-1.11-.73-1.73-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.62.25-1.2.58-1.73.98L4.86 5.05c-.22-.08-.47 0-.59.22L2.23 8.8c-.12.22-.07.49.12.64L4.51 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.15 1.64c-.19.15-.24.42-.12.64l2.04 3.53c.12.22.37.3.59.22l2.55-1.01c.53.4 1.11.73 1.73.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.62-.25 1.2-.58 1.73-.98l2.55 1.01c.22.08.47 0 .59-.22l2.04-3.53c.12-.22.07-.49-.12-.64l-2.16-1.61z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== SETTINGS PANEL ===== -->
  <div class="settings-panel hidden" id="settings-panel">
    <div class="settings-item">
      <span class="settings-label">MUSIC</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-music" checked />
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="settings-item track-row">
      <span class="settings-label">TRACK</span>
      <div class="track-carousel">
        <button class="carousel-btn btn-utility" id="track-prev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 9 12 15 19"/></svg></button>
        <span class="track-title" id="track-title"></span>
        <button class="carousel-btn btn-utility" id="track-next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 15 12 9 19"/></svg></button>
      </div>
    </div>
    <div class="settings-divider"></div>
    <div class="settings-item">
      <span class="settings-label">SOUND EFFECTS</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-sfx" checked />
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <!-- ===== START ===== -->
  <div id="screen-start" class="screen active">
    <div class="start-logo-container">
      <img src="/assets/ui/Logo1_Sudoku.svg" alt="Sudoku" class="start-logo-top" />
      <img src="/assets/ui/Logo2_Fighting.svg" alt="Fighting" class="start-logo-bottom" />
    </div>
    <div class="start-actions">
      <div class="start-section">
        <span class="start-section-label">Join matchmaking queue</span>
        <button class="btn" id="btn-quick-play">QUICK PLAY</button>
      </div>
      <div class="start-divider"></div>
      <div class="start-section">
        <span class="start-section-label">Play with a friend</span>
        <button class="btn" id="btn-create-room">CREATE ROOM</button>
        <div class="join-combo">
          <input type="text" id="input-join-code" class="join-input" placeholder="Enter room code..." maxlength="6" autocomplete="off" spellcheck="false" />
          <button id="btn-join-room">JOIN</button>
        </div>
        <p class="start-error hidden" id="start-error"></p>
      </div>
    </div>
  </div>

  <!-- ===== CHARACTER SELECT ===== -->
  <div id="screen-character-select" class="screen">
    <div class="char-select-scroll">
      <p class="subtitle">Choose your fighter</p>
      <div id="character-grid"></div>
      <button id="btn-select-char" class="btn" disabled>SELECT</button>
    </div>
  </div>

  <!-- ===== LOBBY ===== -->
  <div id="screen-lobby" class="screen">
    <h2 class="lobby-title" id="lobby-title">MATCHMAKING</h2>
    <div class="lobby-players">
      <div class="lobby-player" id="lobby-p1">
        <div class="lobby-player-label">PLAYER 1</div>
        <img id="lobby-p1-portrait" src="/characters/placeholder_fighter.svg" alt="" />
        <span id="lobby-p1-name">---</span>
        <span class="lobby-status waiting">WAITING...</span>
      </div>
      <div class="lobby-vs">VS</div>
      <div class="lobby-player" id="lobby-p2">
        <div class="lobby-player-label">PLAYER 2</div>
        <img id="lobby-p2-portrait" src="/characters/placeholder_fighter.svg" alt="" />
        <span id="lobby-p2-name">---</span>
        <span class="lobby-status waiting">WAITING...</span>
      </div>
    </div>

    <!-- Quick Play: promo share (replaces room code) -->
    <div id="lobby-promo" class="lobby-share hidden">
      <span class="lobby-share-label">SHARE THE GAME</span>
      <button class="btn btn-sm" id="btn-share-game">SHARE</button>
      <p class="lobby-copy-confirm hidden" id="lobby-promo-confirm">Copied!</p>
    </div>

    <!-- Private Room: invite code + copy inline, reserved height from the start -->
    <div id="lobby-invite" class="lobby-share hidden">
      <span class="lobby-share-label">INVITE A FRIEND</span>
      <div class="lobby-invite-row">
        <div class="lobby-share-code" id="lobby-share-code">
          <span class="lobby-share-loading">loading…</span>
        </div>
        <button class="btn btn-sm" id="btn-copy-link">COPY</button>
      </div>
      <p class="lobby-copy-confirm hidden" id="lobby-copy-confirm">Copied!</p>
    </div>

    <p class="lobby-hint">Waiting for opponent...</p>
    <div class="lobby-arena-picker">
      <span class="settings-label">ARENA</span>
      <div class="track-carousel">
        <button class="carousel-btn btn-utility" id="arena-prev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 9 12 15 19"/></svg></button>
        <span class="track-title" id="arena-title"></span>
        <button class="carousel-btn btn-utility" id="arena-next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 15 12 9 19"/></svg></button>
      </div>
    </div>
  </div>

  <!-- ===== GAMEPLAY (pre-round, round, round-end all happen here as overlays) ===== -->
  <div id="screen-gameplay" class="screen">
    <div id="arena-bg-overlay"></div>
    <img id="sun-end" src="" alt="" class="arena-sun" />
    <img id="sun-start" src="" alt="" class="arena-sun" />
    <img id="fight-ground" src="" alt="" />
    <img id="palm-trees" src="" alt="" />
    <img id="buildings" src="" alt="" />

    <!-- Settings row -->
    <div id="gameplay-settings-row" class="action-bar">
      <button class="header-icon-btn btn-utility" id="btn-surrender">SURRENDER</button>
      <button class="header-icon-btn btn-utility" id="btn-settings-gameplay" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
          <path d="M12 15.5a3.5 3.5 0 0 1-3.5-3.5A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.92c.04-.33.07-.64.07-.97s-.03-.66-.07-1l2.16-1.63c.19-.15.24-.42.12-.64l-2.04-3.53c-.12-.22-.37-.3-.59-.22l-2.55 1.01c-.53-.4-1.11-.73-1.73-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.62.25-1.2.58-1.73.98L4.86 5.05c-.22-.08-.47 0-.59.22L2.23 8.8c-.12.22-.07.49.12.64L4.51 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.15 1.64c-.19.15-.24.42-.12.64l2.04 3.53c.12.22.37.3.59.22l2.55-1.01c.53.4 1.11.73 1.73.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.62-.25 1.2-.58 1.73-.98l2.55 1.01c.22.08.47 0 .59-.22l2.04-3.53c.12-.22.07-.49-.12-.64l-2.16-1.61z"/>
        </svg>
      </button>
    </div>

    <!-- HUD bar -->
    <div id="hud">
      <!-- Row 1: names + round label on same row -->
      <div class="hud-name-row">
        <div class="hud-name" id="p1-name">PLAYER 1</div>
        <div class="round-label" id="round-indicator">Round 1</div>
        <div class="hud-name right" id="p2-name">PLAYER 2</div>
      </div>
      <!-- Row 3: health bars + KO (touching) -->
      <div class="hud-bar-row">
        <div class="hud-bar-track left">
          <div class="hud-bar" id="p1-health-bar"></div>
        </div>
        <div class="ko-block">KO</div>
        <div class="hud-bar-track right">
          <div class="hud-bar" id="p2-health-bar"></div>
        </div>
      </div>
      <!-- Row 4: score | timer | score — all just under health bars -->
      <div class="hud-sub-row">
        <div class="hud-sub-left">
          <span class="hud-score" id="p1-score">0 PTS</span>
          <span class="combo-counter" id="p1-combo"></span>
        </div>
        <div class="round-timer" id="round-timer">99</div>
        <div class="hud-sub-right">
          <span class="combo-counter" id="p2-combo"></span>
          <span class="hud-score" id="p2-score">0 PTS</span>
        </div>
      </div>
    </div>

    <!-- Arena -->
    <div id="arena">
      <!-- Left player panel -->
      <div class="player-panel" id="p1-panel">
        <div class="sudoku-grid" id="p1-grid" data-seat="0"></div>
      </div>

      <!-- Center fight stage -->
      <div id="fight-stage">
        <div class="fight-characters">
          <div class="character-wrap" id="p1-char-wrap">
            <img id="p1-char-img" src="" alt="P1 character" class="character-sprite" />
          </div>
          <div class="character-wrap flipped" id="p2-char-wrap">
            <img id="p2-char-img" src="" alt="P2 character" class="character-sprite" />
          </div>
        </div>
      </div>

      <!-- Right player panel -->
      <div class="player-panel" id="p2-panel">
        <div class="sudoku-grid" id="p2-grid" data-seat="1"></div>
      </div>
    </div>

    <!-- Mobile number pad (hidden on desktop) -->
    <div id="mobile-numpad">
      <button class="numpad-btn" data-value="1">1</button>
      <button class="numpad-btn" data-value="2">2</button>
      <button class="numpad-btn" data-value="3">3</button>
      <button class="numpad-btn" data-value="4">4</button>
      <button class="numpad-btn" data-value="5">5</button>
      <button class="numpad-btn" data-value="6">6</button>
      <button class="numpad-btn" data-value="7">7</button>
      <button class="numpad-btn" data-value="8">8</button>
      <button class="numpad-btn" data-value="9">9</button>
      <button class="numpad-btn numpad-clear" data-value="0">✕</button>
    </div>

    <!-- Game overlay (Round X / FIGHT! / KO / VICTORY — on top of gameplay) -->
    <div id="game-overlay" class="game-overlay hidden">
      <div id="game-overlay-main" class="overlay-main"></div>
      <div id="game-overlay-sub" class="overlay-sub"></div>
      <div class="overlay-btn-row hidden" id="overlay-btn-row">
        <button class="btn" id="btn-play-again">PLAY AGAIN</button>
        <button class="btn btn-leave" id="btn-leave">LEAVE</button>
      </div>
    </div>

    <!-- Attack flash -->
    <div id="attack-flash" class="attack-flash hidden"></div>
  </div>


  <!-- Scripts -->
  <script src="/js/config.js"></script>
  <script type="module" src="/js/ws.js"></script>
  <script type="module" src="/js/animation.js"></script>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
